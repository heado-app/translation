      title: "Политика за поверителност"
  about:
    title: "Относно"
    status:
      title: "Състояние"
    version:
      title: "Версия"
    translation:
      title: "Преводи"
  app:
    design:
      light: "Светъл"
      dark: "Тъмен"
      title: "Дизайн"
    title: "Приложение"
  mayo: "Здравей, пухкаво носле! 🐾\n\nРадвам се, че намери пътя до моята тайна зона! Може би вече ме познаваш. Ако не, моето име е Майо и съм Апензелски планински куче. Женско, разбира се! Сега съм на 2 години. Илюстрацията по-горе съм аз. Просто за да ме разпознаеш, ако някога ме видиш.\n\nЗа съжаление, моето семейство и аз трябваше да осъзнаем, че винаги имам фази на тревожност. В един момент всички мислехме, че моите хормони полудяват преди разгонването и затова не съм толкова смела. Но не бяхме напълно сигурни.\n\nМоят собственик Корина тогава имаше идея, че може да се направи календар за кучета, подобен на този за жените. Речено-сторено! Моят господар Фабиан е програмист. Той също намери идеята за страхотна и започна веднага.\n\nНо Фабиан скоро осъзна, че няма представа за цикъла на кучето. Или какво включва това. Така че той направи много изследвания в интернет, зададе много въпроси на Корина и ги сравни с съществуващите приложения за жени.\n\nСлед няколко месеца и тестов период с моите приятели с лапи, дойде времето! На 27.11.2023 публикувахме Heado в App Store за Android и iOS.\n\nВсъщност, моите фази на тревожност идват от моите хормони. Но изглежда, че става много по-добре с всяко разгонване. Определено ще го държим под око.\n\nНадявам се, че това приложение може да помогне и на вас и вашите хора да намерите проблеми или неправилности по-бързо. И също така да имате необходимите доказателства при ветеринаря.\n\nАко вие или вашите хора имате идеи или желания, моля, свържете се с мен на mayo@heado.app. Също така в случай на проблеми, грешки или трудности.\n\nЗабавлявайте се с приложението! <3\n\nМайо, Корина & Фабиан"

