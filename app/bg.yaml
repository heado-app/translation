    period:
      title: "Период"
      enable: "Добави периодичен цикъл"
      disable: "Изтрий периодичен цикъл"
      proestrus_start_date:
        label: "Начало на предразгонване (proestrus)"
        info:
          title: "Предразгонване (proestrus)"
          message: "Оеструсът започва, когато вулвата на вашата кучка се подуе и се появи кървящ вагинален секрет.\n\nСредната продължителност е 9 дни и може да варира между 3 и 17 дни.\n\nДатата трябва винаги да бъде посочена."
        error:
          in_future: "Датата не трябва да е в бъдещето"
      estrus_start_date:
        label: "Начало на разгонване (estrus)"
        info:
          title: "Разгонване (estrus)"
          message: "С началото на разгонването вашата кучка ще покаже готовност за чифтосване (стояща разгоненост). Вагиналният секрет все още е възможен, но той прилича повече на месна вода и може да бъде слизест.\n\nСредната продължителност е 9 дни и може да варира между 3 и 21 дни.\n\nАко тази фаза все още не е започнала или не желаете да документирате тази фаза, оставете това поле празно."
        error:
          in_future: "Датата не трябва да е в бъдещето"
      metestrus_start_date:
        label: "Начало на следразгонване (metestrus)"
        info:
          title: "Следразгонване (metestrus)"
          message: "Периодът след разгонването се характеризира с края на чифтосването. Освен това, вагиналният секрет спира и вулвата се свива. Възможна е фалшива бременност по това време.\n\nАко тази фаза все още не е започнала или не желаете да документирате тази фаза, оставете това поле празно."
        error:
          in_future: "Датата не трябва да е в бъдещето"
      end_date:
        label: "Край на периода (начало на фаза на почивка)"
        info:
          title: "Фаза на почивка (anestrus)"
          message: "Няма признаци на сексуалния цикъл по време на фазата на почивка. Вулвата сега е напълно свита.\n\nОставете това поле празно, ако периодът все още не е приключил."
