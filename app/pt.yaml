    period:
      title: "Período"
      enable: "Adicionar ciclo do período"
      disable: "Excluir ciclo do período"
      proestrus_start_date:
        label: "Início do proestro"
        info:
          title: "Proestro"
          message: "O estro começa quando a vulva do seu cão incha e aparece uma secreção vaginal sanguinolenta.\n\nA duração média é de 9 dias e pode variar entre 3 e 17 dias.\n\nA data deve sempre ser especificada."
        error:
          in_future: "A data não deve estar no futuro"
      estrus_start_date:
        label: "Início do estro"
        info:
          title: "Estro"
          message: "No início do estro, seu cão mostrará disposição para o acasalamento (estro de pé). A secreção vaginal ainda é possível, mas se assemelha mais a carne líquida e pode ser mucosa.\n\nA duração média é de 9 dias e pode variar entre 3 e 21 dias.\n\nSe essa fase ainda não começou ou você não deseja documentar essa fase, deixe este campo em branco."
        error:
          in_future: "A data não deve estar no futuro"
      metestrus_start_date:
        label: "Início do metaestro"
        info:
          title: "Metaestro"
          message: "O período após o estro é caracterizado pelo fim do acasalamento. Além disso, a secreção vaginal cessa e a vulva retrai. Uma falsa gestação é possível durante esse período.\n\nSe essa fase ainda não começou ou você não deseja documentar essa fase, deixe este campo em branco."
        error:
          in_future: "A data não deve estar no futuro"
      end_date:
        label: "Fim do período (início da fase de repouso)"
        info:
          title: "Fase de repouso (anestro)"
          message: "Não há sinais de ciclo sexual durante a fase de repouso. A vulva agora está completamente retraída.\n\nDeixe este campo em branco se o período ainda não terminou."
        error:
          in_future: "A data não deve estar no futuro"
    false_pregnancy:
      title: "Falsa gestação"
      enable: "Adicionar falsa gestação"
      disable: "Excluir falsa gestação"
      start_date:
        label: "Início da falsa gestação"
        error:
          in_future: "A data não deve estar no futuro"
      end_date:
