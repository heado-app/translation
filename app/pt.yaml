      title: "Traduções"
  app:
    design:
      light: "Claro"
      dark: "Escuro"
      title: "Tema"
    title: "Aplicativo"
  mayo: "Olá, focinho peludo! 🐾\n\nEstou feliz que você encontrou meu espaço secreto! Talvez você já me conheça. Se não, meu nome é Mayo e sou um cão da montanha Appenzeller. Claro, sou uma fêmea! Agora tenho 2 anos. A ilustração acima sou eu. Só para você me reconhecer se me vir algum dia.\n\nInfelizmente, minha família e eu tivemos que entender que sempre tenho fases de ansiedade. Em algum momento, todos pensávamos que meus hormônios enlouqueciam antes do meu ciclo e por isso eu não era mais tão corajosa. Mas não tínhamos certeza absoluta.\n\nMinha dona Korinna teve então a ideia de que poderia ser feito um calendário para cadelas, assim como para mulheres. Dito e feito! Meu dono Fabian é programador! Ele também achou que era uma ideia fantástica e começou imediatamente.\n\nMas Fabian logo percebeu que não tinha ideia do ciclo de uma cadela. Ou do que isso envolvia. Então, ele fez muitas pesquisas na internet, fez muitas perguntas para Korinna e comparou com os aplicativos existentes para mulheres.\n\nDepois de alguns meses e uma fase de testes com meus amigos de quatro patas, chegou a hora! Em 27/11/2023, lançamos Heado na App Store para Android e iOS.\n\nNa verdade, minhas fases de ansiedade vêm dos meus hormônios. Mas parece que melhora muito a cada ciclo. Com certeza vamos ficar de olho.\n\nEspero que este aplicativo também possa ajudar você e seus humanos a encontrar problemas ou irregularidades mais rapidamente. E também ter as provas necessárias no veterinário.\n\nSe você ou seus humanos tiverem ideias ou pedidos, entre em contato comigo pelo e-mail mayo@heado.app. Também em caso de problemas, erros ou dificuldades.\n\nDivirta-se com o aplicativo! <3\n\nMayo, Korinna & Fabian"

