      title: "Oversættelser"
  app:
    design:
      light: "Lys"
      dark: "Mørk"
      title: "Design"
    title: "App"
  mayo: "Hej pelsnæse! 🐾\n\nDejligt at du fandt vej til mit hemmelige område! Måske kender du mig allerede. Hvis ikke, mit navn er Mayo, og jeg er en Appenzeller Sennenhund. En hun, selvfølgelig! Jeg er nu 2 år gammel. Illustrationen ovenfor er mig. Bare så du kan genkende mig, hvis du nogensinde ser mig.\n\nDesværre måtte min familie og jeg indse, at jeg altid har angstfaser. På et tidspunkt troede vi alle, at mine hormoner blev skøre før min løbetid, og derfor var jeg ikke så modig længere. Men vi var ikke helt sikre.\n\nMin ejer Korinna fik så ideen, at man kunne lave en kalender til hunhunde, ligesom til menneskekvinder. Sagt og gjort! Min herre Fabian er programmør. Han syntes også, det var en fantastisk idé og gik straks i gang.\n\nMen Fabian indså hurtigt, at han ikke vidste noget om en hunds cyklus. Eller hvad det indebærer. Så han lavede en masse research på internettet, stillede Korinna en masse spørgsmål og sammenlignede det med eksisterende apps til menneskekvinder.\n\nEfter et par måneder og en testfase med mine potevenner var det tid! Den 27.11.2023 udgav vi Heado i App Store til Android og iOS.\n\nFaktisk kommer mine angstfaser fra mine hormoner. Men det ser ud til at blive meget bedre med hver løbetid. Vi holder bestemt øje med det.\n\nJeg håber, vi kan hjælpe dig og dine mennesker med denne app og finde problemer eller uregelmæssigheder hurtigere. Og også have de nødvendige beviser hos dyrlægen.\n\nHvis du eller dine mennesker har nogen ideer eller ønsker, så kontakt mig venligst på mayo@heado.app. Også i tilfælde af problemer, fejl eller vanskeligheder.\n\nHav det sjovt med appen! <3\n\nMayo, Korinna & Fabian"

