          in_future: "Datoen må ikke være i fremtiden"
      estrus_start_date:
        label: "Start af brunst (estrus)"
        info:
          title: "Brunst (estrus)"
          message: "Ved begyndelsen af brunsten viser din hund parringsvillighed (stående brunst). Vaginal udflåd er stadig muligt, men det ligner mere kødvand og kan være slimagtigt.\n\nDen gennemsnitlige varighed er 9 dage og kan variere mellem 3 og 21 dage.\n\nHvis denne fase endnu ikke er begyndt, eller du ikke ønsker at dokumentere denne fase, lad dette felt stå tomt."
        error:
          in_future: "Datoen må ikke være i fremtiden"
      metestrus_start_date:
        label: "Start af efterbrunst (metestrus)"
        info:
          title: "Efterbrunst (metestrus)"
          message: "Perioden efter brunsten er kendetegnet ved slutningen af parringen. Derudover stopper vaginal udflåd, og vulva trækker sig tilbage. En falsk graviditet er mulig i denne tid.\n\nHvis denne fase endnu ikke er begyndt, eller du ikke ønsker at dokumentere denne fase, lad dette felt stå tomt."
