      disable: "Elimina ciclo del periodo"
      proestrus_start_date:
        label: "Inizio del proestro"
        info:
          title: "Proestro"
          message: "L'estro inizia quando la vulva del tuo cane si gonfia e appare una secrezione vaginale sanguinolenta.\n\nLa durata media è di 9 giorni e può variare tra 3 e 17 giorni.\n\nLa data deve sempre essere specificata."
        error:
          in_future: "La data non deve essere nel futuro"
      estrus_start_date:
        label: "Inizio dell'estro"
        info:
          title: "Estro"
          message: "Con l'inizio dell'estro, il tuo cane mostrerà disponibilità all'accoppiamento (estro in piedi). La secrezione vaginale è ancora possibile, ma assomiglia più a carne liquida e può essere mucosa.\n\nLa durata media è di 9 giorni e può variare tra 3 e 21 giorni.\n\nSe questa fase non è ancora iniziata o non desideri documentare questa fase, lascia questo campo vuoto."
        error:
          in_future: "La data non deve essere nel futuro"
      metestrus_start_date:
        label: "Inizio del metaestro"
        info:
          title: "Metaestro"
          message: "Il periodo dopo l'estro è caratterizzato dalla fine dell'accoppiamento. Inoltre, la secrezione vaginale cessa e la vulva si ritrae. Una falsa gravidanza è possibile durante questo periodo.\n\nSe questa fase non è ancora iniziata o non desideri documentare questa fase, lascia questo campo vuoto."
        error:
          in_future: "La data non deve essere nel futuro"
      end_date:
        label: "Fine del periodo (inizio della fase di riposo)"
        info:
          title: "Fase di riposo (anestro)"
          message: "Non ci sono segni di ciclo sessuale durante la fase di riposo. La vulva è ora completamente ritratta.\n\nLascia questo campo vuoto se il periodo non è ancora terminato."
        error:
          in_future: "La data non deve essere nel futuro"
    false_pregnancy:
      title: "Falsa gravidanza"
      enable: "Aggiungi falsa gravidanza"
      disable: "Elimina falsa gravidanza"
      start_date:
