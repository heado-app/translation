      title: "Traduzioni"
  app:
    design:
      light: "Chiaro"
      dark: "Scuro"
      title: "Tema"
    title: "App"
  mayo: "Ciao, tartufo peloso! 🐾\n\nSono felice che tu abbia trovato la strada per la mia area segreta! Forse mi conosci già. Se no, mi chiamo Mayo e sono un cane di montagna Appenzeller. Ovviamente sono una femmina! Ora ho 2 anni. L'illustrazione sopra sono io. Solo per farti riconoscere se mi vedi mai.\n\nSfortunatamente, la mia famiglia e io abbiamo dovuto capire che ho sempre fasi di ansia. A un certo punto, tutti pensavamo che i miei ormoni impazzissero prima del mio ciclo e per questo non ero più così coraggiosa. Ma non eravamo completamente sicuri.\n\nLa mia padrona Korinna ha poi avuto l'idea che si potrebbe fare un calendario per le cagne, proprio come per le donne. Detto fatto! Il mio padrone Fabian è un programmatore! Anche lui pensava che fosse un'idea fantastica e ha iniziato subito.\n\nMa Fabian si è presto reso conto che non aveva idea del ciclo di una cagna. O di cosa comportasse. Quindi ha fatto molte ricerche su Internet, ha fatto molte domande a Korinna e ha confrontato con le app esistenti per le donne.\n\nDopo alcuni mesi e una fase di test con i miei amici a quattro zampe, è arrivato il momento! Il 27/11/2023 abbiamo rilasciato Heado su App Store per Android e iOS.\n\nIn realtà, le mie fasi di ansia provengono dai miei ormoni. Ma sembra che migliori molto con ogni ciclo. Sicuramente lo terremo sott'occhio.\n\nSpero che questa app possa aiutare anche te e i tuoi umani a trovare problemi o irregolarità più rapidamente. E anche avere le prove necessarie dal veterinario.\n\nSe tu o i tuoi umani avete idee o richieste, contattatemi a mayo@heado.app. Anche in caso di problemi, errori o difficoltà.\n\nDivertiti con l'app! <3\n\nMayo, Korinna & Fabian"

