        info:
          title: "Proöstrus"
          message: "Östrus alkaa, kun koirasi häpy turpoaa ja ilmestyy verinen emätinvuoto.\n\nKeskimääräinen kesto on 9 päivää ja voi vaihdella 3 ja 17 päivän välillä.\n\nPäivämäärä on aina ilmoitettava."
        error:
          in_future: "Päivämäärä ei saa olla tulevaisuudessa"
      estrus_start_date:
        label: "Östruksen alku"
        info:
          title: "Östrus"
          message: "Östruksen alkaessa koirasi osoittaa paritteluhalukkuutta (seisova östrus). Emätinvuoto on edelleen mahdollista, mutta se muistuttaa enemmän lihavettä ja voi olla limainen.\n\nKeskimääräinen kesto on 9 päivää ja voi vaihdella 3 ja 21 päivän välillä.\n\nJos tämä vaihe ei ole vielä alkanut tai et halua dokumentoida tätä vaihetta, jätä tämä kenttä tyhjäksi."
        error:
          in_future: "Päivämäärä ei saa olla tulevaisuudessa"
      metestrus_start_date:
        label: "Metöstruksen alku"
        info:
          title: "Metöstrus"
          message: "Jakso östruksen jälkeen on ominaista parittelun loppumiselle. Lisäksi emätinvuoto lakkaa ja häpy vetäytyy. Väärä raskaus on mahdollista tänä aikana.\n\nJos tämä vaihe ei ole vielä alkanut tai et halua dokumentoida tätä vaihetta, jätä tämä kenttä tyhjäksi."
        error:
          in_future: "Päivämäärä ei saa olla tulevaisuudessa"
      end_date:
        label: "Jakson loppu (lepovaiheen alku)"
        info:
          title: "Lepovaihe (anestrus)"
          message: "Lepovaiheessa ei ole merkkejä seksuaalisesta syklistä. Häpy on nyt täysin vetäytynyt.\n\nJätä tämä kenttä tyhjäksi, jos jakso ei ole vielä päättynyt."
