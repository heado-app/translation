    design:
      light: "Vaalea"
      dark: "Tumma"
      title: "Malli"
    title: "Sovellus"
  mayo: "Hei, karvakuono! 🐾\n\nIhanaa, että löysit tiesi salaiselle alueelleni! Ehkä tunnet minut jo. Jos et, nimeni on Mayo ja olen Appenzellerin paimenkoira. Tietenkin olen narttu! Nyt olen 2-vuotias. Yläpuolella oleva kuva olen minä. Jotta tunnistat minut, jos joskus näet minut.\n\nValitettavasti perheeni ja minä olemme joutuneet huomaamaan, että minulla on aina ahdistusvaiheita. Jossain vaiheessa kaikki ajattelivat, että hormonini menevät sekaisin ennen juoksuaikaa ja siksi en ole enää niin rohkea. Mutta emme olleet täysin varmoja.\n\nOmistajani Korinna sai sitten idean, että voisi tehdä kalenterin narttukoirille, kuten naisillekin. Sanoi ja teki! Isäntäni Fabian on ohjelmoija. Hänkin piti ideaa loistavana ja aloitti heti.\n\nMutta Fabian huomasi pian, ettei hän tiennyt mitään koiran syklisestä. Tai mitä se sisältää. Joten hän teki paljon tutkimusta internetissä, esitti Korinnalle paljon kysymyksiä ja vertaili sitä olemassa oleviin naisille tarkoitettuihin sovelluksiin.\n\nMuutaman kuukauden ja testivaiheen jälkeen tassukavereideni kanssa tuli aika! 27.11.2023 julkaisimme Heado Android- ja iOS-laitteille App Storessa.\n\nTodellisuudessa ahdistusvaiheeni johtuvat hormoneistani. Mutta näyttää siltä, että jokaisen juoksuajan myötä se paranee paljon. Pidämme sitä ehdottomasti silmällä.\n\nToivon, että tämä sovellus voi auttaa myös sinua ja ihmisiäsi löytämään ongelmia tai epäsäännöllisyyksiä nopeammin. Ja myös saada tarvittavat todisteet eläinlääkärissä.\n\nJos sinulla tai ihmisilläsi on ideoita tai toiveita, ota yhteyttä osoitteeseen mayo@heado.app. Myös ongelmien, virheiden tai vaikeuksien tapauksessa.\n\nNauti sovelluksesta! <3\n\nMayo, Korinna & Fabian"

