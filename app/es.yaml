      title: "Traducciones"
  app:
    design:
      light: "Claro"
      dark: "Oscuro"
      title: "Diseño"
    title: "App"
  mayo: "¡Hola, trufa peluda! 🐾\n\n¡Feliz de que hayas encontrado el camino a mi área secreta! Tal vez ya me conozcas. Si no, mi nombre es Mayo y soy un perro de montaña Appenzeller. ¡Claro, soy una hembra! Ahora tengo 2 años. La ilustración de arriba soy yo. Solo para que me reconozcas si alguna vez me ves.\n\nDesafortunadamente, mi familia y yo tuvimos que darnos cuenta de que siempre tengo fases de ansiedad. En algún momento, todos pensábamos que mis hormonas se volvían locas antes de mi celo y por eso ya no era tan valiente. Pero no estábamos completamente seguros.\n\nMi dueña Korinna tuvo entonces la idea de que podrías hacer un calendario para las perras, igual que para las mujeres humanas. Dicho y hecho. ¡Mi amo Fabian es programador! También pensó que era una idea fantástica y comenzó de inmediato.\n\nPero Fabian pronto se dio cuenta de que no tenía idea del ciclo de una perra. O de lo que implica. Así que hizo muchas investigaciones en Internet, hizo muchas preguntas a Korinna y comparó con las aplicaciones existentes para mujeres humanas.\n\nDespués de unos meses y una fase de prueba con mis amigos de cuatro patas, ¡llegó el momento! El 27.11.2023, lanzamos Heado en la App Store para Android e iOS.\n\nDe hecho, mis fases de ansiedad provienen de mis hormonas. Pero parece que mejora mucho con cada celo. Definitivamente lo mantendremos bajo vigilancia.\n\nEspero que esta aplicación también te ayude a ti y a tus humanos a encontrar problemas o irregularidades más rápidamente. Y también tener las pruebas necesarias en el veterinario.\n\nSi tú o tus humanos tienen ideas o solicitudes, por favor contáctame en mayo@heado.app. También en caso de problemas, errores o dificultades.\n\n¡Diviértete con la app! <3\n\nMayo, Korinna & Fabian"

