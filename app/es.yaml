      proestrus_start_date:
        label: "Inicio del proestro"
        info:
          title: "Proestro"
          message: "El estro comienza cuando la vulva de tu perra se hincha y aparece una secreción vaginal sanguinolenta.\n\nLa duración media es de 9 días y puede variar entre 3 y 17 días.\n\nLa fecha siempre debe especificarse."
        error:
          in_future: "La fecha no debe estar en el futuro"
      estrus_start_date:
        label: "Inicio del estro"
        info:
          title: "Estro"
          message: "Con el inicio del estro, tu perra mostrará disposición para aparearse (estro de pie). La secreción vaginal aún es posible, pero se parece más a agua con carne y puede ser mucosa.\n\nLa duración media es de 9 días y puede variar entre 3 y 21 días.\n\nSi esta fase aún no ha comenzado o no deseas documentar esta fase, deja este campo en blanco."
        error:
          in_future: "La fecha no debe estar en el futuro"
      metestrus_start_date:
        label: "Inicio del metaestro"
        info:
          title: "Metaestro"
          message: "El período después del estro se caracteriza por el final del apareamiento. Además, la secreción vaginal cesa y la vulva se retrae. Una pseudogestación es posible durante este tiempo.\n\nSi esta fase aún no ha comenzado o no deseas documentar esta fase, deja este campo en blanco."
        error:
          in_future: "La fecha no debe estar en el futuro"
      end_date:
        label: "Fin del periodo (inicio de la fase de descanso)"
        info:
          title: "Fase de descanso (anestro)"
          message: "No hay signos del ciclo sexual durante la fase de descanso. La vulva está ahora completamente retraída.\n\nDeja este campo en blanco si el periodo aún no ha terminado."
        error:
          in_future: "La fecha no debe estar en el futuro"
