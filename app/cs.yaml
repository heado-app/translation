  app:
    design:
      light: "Světlý"
      dark: "Tmavý"
      title: "Design"
    title: "Aplikace"
  mayo: "Ahoj, chlupáči! 🐾\n\nJsem rád, že jste našli cestu do mé tajné oblasti! Možná mě už znáte. Pokud ne, jmenuji se Mayo a jsem appenzellský salašnický pes. Samozřejmě, že jsem fenka! Teď mám 2 roky. Ilustrace nahoře jsem já. Jen abyste mě poznali, když mě někdy uvidíte.\n\nBohužel jsme si moje rodina a já museli uvědomit, že mám stále úzkostné fáze. V jednu chvíli jsme si všichni mysleli, že moje hormony před háráním šílí a proto nejsem tak odvážná. Ale nebyli jsme si úplně jistí.\n\nMoje majitelka Korinna pak měla nápad, že by se mohl udělat kalendář pro fenky, stejně jako pro ženy. Řekla a udělala! Můj pán Fabian je programátor. Také si myslel, že je to skvělý nápad a hned začal.\n\nAle Fabian brzy zjistil, že nemá tušení o cyklu psa. Nebo o tom, co to obnáší. Takže hodně hledal na internetu, ptal se Korinně spoustu otázek a porovnával to s existujícími aplikacemi pro ženy.\n\nPo několika měsících a testovací fázi s mými kamarády s tlapkami přišel čas! 27.11.2023 jsme vydali Heado v App Store pro Android a iOS.\n\nVe skutečnosti moje úzkostné fáze pocházejí z mých hormonů. Ale zdá se, že se s každým háráním hodně zlepšuje. Určitě to budeme sledovat.\n\nDoufám, že tato aplikace může také pomoci vám a vašim lidem najít problémy nebo nesrovnalosti rychleji. A také mít potřebné důkazy u veterináře.\n\nPokud vy nebo vaši lidé máte nějaké nápady nebo přání, kontaktujte mě na mayo@heado.app. Také v případě problémů, chyb nebo potíží.\n\nUžijte si aplikaci! <3\n\nMayo, Korinna & Fabian"

