      proestrus_start_date:
        label: "Začátek předhárání (proestrus)"
        info:
          title: "Předhárání (proestrus)"
          message: "Oestrus začíná, když se vulva vaší fenky zvětší a objeví se krvavý výtok.\n\nPrůměrná doba trvání je 9 dní a může se pohybovat mezi 3 a 17 dny.\n\nDatum musí být vždy uvedeno."
        error:
          in_future: "Datum nesmí být v budoucnosti"
      estrus_start_date:
        label: "Začátek hárání (estrus)"
        info:
          title: "Hárání (estrus)"
          message: "S nástupem hárání vaše fenka ukáže ochotu k páření (stojící hárání). Vagínální výtok je stále možný, ale připomíná více masovou vodu a může být slizký.\n\nPrůměrná doba trvání je 9 dní a může se pohybovat mezi 3 a 21 dny.\n\nPokud tato fáze ještě nezačala nebo nechcete tuto fázi dokumentovat, nechte toto pole prázdné."
        error:
          in_future: "Datum nesmí být v budoucnosti"
      metestrus_start_date:
        label: "Začátek pohárání (metestrus)"
        info:
          title: "Pohárání (metestrus)"
          message: "Období po hárání se vyznačuje koncem páření. Navíc vaginální výtok přestane a vulva se stáhne. Během této doby je možná falešná březost.\n\nPokud tato fáze ještě nezačala nebo nechcete tuto fázi dokumentovat, nechte toto pole prázdné."
        error:
          in_future: "Datum nesmí být v budoucnosti"
      end_date:
        label: "Konec období (začátek klidové fáze)"
        info:
          title: "Klidová fáze (anestrus)"
          message: "Během klidové fáze nejsou žádné známky sexuálního cyklu. Vulva je nyní zcela stažena.\n\nNechte toto pole prázdné, pokud období ještě neskončilo."
