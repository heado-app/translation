    design:
      light: "Hele"
      dark: "Tume"
      title: "Disain"
    title: "Rakendus"
  mayo: "Tere, karvane nina! 🐾\n\nMul on hea meel, et leidsid tee minu salajasele alale! Võib-olla tunned mind juba. Kui ei, siis minu nimi on Mayo ja ma olen Appenzelleri alpi karjakoer. Loomulikult olen ma emane! Praegu olen 2-aastane. Ülaltoodud illustratsioon olen mina. Lihtsalt selleks, et tunneksid mind ära, kui mind kunagi näed.\n\nKahjuks pidime mina ja minu pere mõistma, et mul on alati ärevuse faase. Mingil hetkel arvasime kõik, et minu hormoonid lähevad enne jooksuaega hulluks ja sellepärast pole ma enam nii julge. Aga me ei olnud täiesti kindlad.\n\nMinu omanik Korinna sai siis idee, et võiks teha kalendri emastele koertele, nagu on naistele. Öeldud-tehtud! Minu isand Fabian on programmeerija. Ka tema leidis, et see on suurepärane idee ja hakkas kohe pihta.\n\nAga Fabian mõistis varsti, et tal pole aimugi koera tsüklist. Või mida see sisaldab. Nii et ta tegi palju uurimistööd internetis, esitas Korinnale palju küsimusi ja võrdles seda olemasolevate naiste rakendustega.\n\nPärast mõnda kuud ja katsefaasi minu käppasõpradega oli aeg käes! 27.11.2023 andsime Heado välja Androidi ja iOS-i jaoks App Store'is.\n\nTegelikult tulevad minu ärevuse faasid minu hormoonidest. Aga tundub, et iga jooksuajaga läheb palju paremaks. Me hoiame seda kindlasti silma peal.\n\nLoodan, et see rakendus võib aidata ka teid ja teie inimesi probleeme või ebanormaalsusi kiiremini leida. Ja samuti vajalikud tõendid loomaarsti juures.\n\nKui teil või teie inimestel on ideid või soove, võtke minuga ühendust aadressil mayo@heado.app. Samuti probleemide, vigade või raskuste korral.\n\nLõbutse rakendusega! <3\n\nMayo, Korinna & Fabian"

