    period:
      title: "Περίοδος"
      enable: "Προσθήκη κύκλου περιόδου"
      disable: "Διαγραφή κύκλου περιόδου"
      proestrus_start_date:
        label: "Αρχή προοίστρος (proestrus)"
        info:
          title: "Προοίστρος (proestrus)"
          message: "Ο οίστρος ξεκινά όταν η αιδοία της σκύλας σας διογκώνεται και εμφανίζεται αιματηρή κολπική έκκριση.\n\nΗ μέση διάρκεια είναι 9 ημέρες και μπορεί να κυμαίνεται μεταξύ 3 και 17 ημερών.\n\nΗ ημερομηνία πρέπει πάντα να καθορίζεται."
        error:
          in_future: "Η ημερομηνία δεν πρέπει να είναι στο μέλλον"
      estrus_start_date:
        label: "Αρχή οίστρου (estrus)"
        info:
          title: "Οίστρος (estrus)"
          message: "Με την έναρξη του οίστρου, η σκύλα σας θα δείξει ετοιμότητα για ζευγάρωμα (όρθιος οίστρος). Η κολπική έκκριση είναι ακόμα δυνατή, αλλά μοιάζει περισσότερο με νερό κρέατος και μπορεί να είναι βλέννη.\n\nΗ μέση διάρκεια είναι 9 ημέρες και μπορεί να κυμαίνεται μεταξύ 3 και 21 ημερών.\n\nΕάν αυτή η φάση δεν έχει ακόμη ξεκινήσει ή δεν επιθυμείτε να την καταγράψετε, αφήστε αυτό το πεδίο κενό."
        error:
          in_future: "Η ημερομηνία δεν πρέπει να είναι στο μέλλον"
      metestrus_start_date:
        label: "Αρχή μετοίστρου (metestrus)"
        info:
          title: "Μετοίστρος (metestrus)"
          message: "Η περίοδος μετά τον οίστρο χαρακτηρίζεται από το τέλος του ζευγαρώματος. Επιπλέον, η κολπική έκκριση σταματά και η αιδοία συστέλλεται. Μια ψευδοκύηση είναι πιθανή κατά τη διάρκεια αυτής της περιόδου.\n\nΕάν αυτή η φάση δεν έχει ακόμη ξεκινήσει ή δεν επιθυμείτε να την καταγράψετε, αφήστε αυτό το πεδίο κενό."
        error:
          in_future: "Η ημερομηνία δεν πρέπει να είναι στο μέλλον"
      end_date:
        label: "Τέλος της περιόδου (αρχή φάσης ανάπαυσης)"
        info:
          title: "Φάση ανάπαυσης (anestrus)"
          message: "Δεν υπάρχουν σημάδια του σεξουαλικού κύκλου κατά τη φάση ανάπαυσης. Η αιδοία είναι πλέον πλήρως συσταλμένη.\n\nΑφήστε αυτό το πεδίο κενό αν η περίοδος δεν έχει ακόμη τελειώσει."
