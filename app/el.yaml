    design:
      light: "Φωτεινό"
      dark: "Σκοτεινό"
      title: "Σχεδιασμός"
    title: "Εφαρμογή"
  mayo: "Γεια σου, γούνινη μύτη! 🐾\n\nΧαίρομαι που βρήκες τον δρόμο σου στην κρυφή μου περιοχή! Ίσως με ξέρεις ήδη. Αν όχι, το όνομά μου είναι Μάγιο και είμαι ένας Απέντζελ Σενενχούντ. Φυσικά, είμαι θηλυκή! Τώρα είμαι 2 ετών. Η εικονογράφηση από πάνω είμαι εγώ. Απλά για να με αναγνωρίσεις αν με δεις ποτέ.\n\nΔυστυχώς, η οικογένειά μου και εγώ έπρεπε να συνειδητοποιήσουμε ότι πάντα έχω φάσεις άγχους. Σε κάποια στιγμή, όλοι πιστεύαμε ότι οι ορμόνες μου τρελαίνονταν πριν από τη θερμότητα και γι' αυτό δεν ήμουν τόσο γενναία πια. Αλλά δεν ήμασταν πλήρως σίγουροι.\n\nΗ ιδιοκτήτριά μου, Κορίνα, τότε σκέφτηκε ότι θα μπορούσε να φτιαχτεί ένα ημερολόγιο για θηλυκούς σκύλους, όπως για τις γυναίκες. Είπε και έγινε! Ο κύριός μου, Φάμπιαν, είναι προγραμματιστής. Επίσης βρήκε την ιδέα φανταστική και άρχισε αμέσως.\n\nΑλλά ο Φάμπιαν σύντομα συνειδητοποίησε ότι δεν είχε ιδέα για τον κύκλο ενός σκύλου. Ή τι περιλαμβάνει. Έτσι, έκανε πολλές έρευνες στο διαδίκτυο, έθεσε πολλές ερωτήσεις στην Κορίνα και το συνέκρινε με τις υπάρχουσες εφαρμογές για γυναίκες.\n\nΜετά από μερικούς μήνες και μια φάση δοκιμών με τους φίλους μου με τα πόδια, ήρθε η ώρα! Στις 27.11.2023, κυκλοφορήσαμε το Heado στο App Store για Android και iOS.\n\nΣτην πραγματικότητα, οι φάσεις άγχους μου προέρχονται από τις ορμόνες μου. Αλλά φαίνεται να γίνεται πολύ καλύτερο με κάθε θερμότητα. Θα το παρακολουθούμε σίγουρα.\n\nΕλπίζω ότι αυτή η εφαρμογή μπορεί να βοηθήσει και εσάς και τους ανθρώπους σας να βρείτε προβλήματα ή ανωμαλίες πιο γρήγορα. Και επίσης να έχετε τα απαραίτητα αποδεικτικά στοιχεία στον κτηνίατρο.\n\nΑν εσείς ή οι άνθρωποί σας έχετε ιδέες ή επιθυμίες, παρακαλώ επικοινωνήστε μαζί μου στο mayo@heado.app. Επίσης σε περίπτωση προβλημάτων, σφαλμάτων ή δυσκολιών.\n\nΚαλή διασκέδαση με την εφαρμογή! <3\n\nΜάγιο, Κορίνα & Φάμπιαν"

