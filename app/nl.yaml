      title: "Vertalingen"
  app:
    design:
      light: "Licht"
      dark: "Donker"
      title: "Ontwerp"
    title: "App"
  mayo: "Hallo, pluizige neus! 🐾\n\nIk ben blij dat je mijn geheime ruimte hebt gevonden! Misschien ken je me al. Zo niet, mijn naam is Mayo en ik ben een Appenzeller Sennenhond. Natuurlijk ben ik een teef! Ik ben nu 2 jaar oud. De illustratie hierboven ben ik. Alleen zodat je me kunt herkennen als je me ooit ziet.\n\nHelaas moest mijn familie en ik ontdekken dat ik altijd angstfases heb. Op een gegeven moment dachten we allemaal dat mijn hormonen gek werden voordat mijn cyclus begon en daarom was ik niet meer zo dapper. Maar we waren niet helemaal zeker.\n\nMijn baasje Korinna bedacht toen dat er een kalender voor teven gemaakt kon worden, net zoals voor vrouwen. Zo gezegd, zo gedaan! Mijn baasje Fabian is een programmeur. Hij vond het ook een fantastisch idee en begon meteen.\n\nMaar Fabian realiseerde zich al snel dat hij geen idee had van de cyclus van een hond. Of wat dat inhield. Dus deed hij veel onderzoek op internet, stelde veel vragen aan Korinna en vergeleek het met bestaande apps voor vrouwen.\n\nNa een paar maanden en een testfase met mijn pootvrienden was het tijd! Op 27-11-2023 brachten we Heado uit in de App Store voor Android en iOS.\n\nEigenlijk komen mijn angstfases door mijn hormonen. Maar het lijkt veel beter te worden met elke cyclus. We zullen het zeker in de gaten houden.\n\nIk hoop dat deze app jou en je mensen kan helpen om sneller problemen of onregelmatigheden te vinden. En ook om de nodige bewijzen bij de dierenarts te hebben.\n\nAls jij of je mensen ideeën of wensen hebben, neem dan gerust contact met me op via mayo@heado.app. Ook in geval van problemen, fouten of moeilijkheden.\n\nGeniet van de app! <3\n\nMayo, Korinna & Fabian"

