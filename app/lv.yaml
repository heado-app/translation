    design:
      light: "Gaišs"
      dark: "Tumšs"
      title: "Dizains"
    title: "Lietotne"
  mayo: "Sveiki, pūkainais deguns! 🐾\n\nEsmu priecīgs, ka atradāt manu slepeno zonu! Varbūt jūs jau mani pazīstat. Ja nē, mans vārds ir Mayo un esmu Appenzeller Sennenhund. Protams, esmu kuce! Tagad man ir 2 gadi. Augšējā attēlā es esmu es. Tikai, lai jūs mani atpazītu, ja kādreiz mani redzēsiet.\n\nDiemžēl manai ģimenei un man nācās saprast, ka man vienmēr ir trauksmes fāzes. Kādā brīdī mēs visi domājām, ka mani hormoni trako pirms mana cikla, un tāpēc es vairs neesmu tik drosmīga. Bet mēs nebijām pilnīgi pārliecināti.\n\nMana saimniece Korinna tad izdomāja, ka varētu izveidot kalendāru kucēm, tieši tāpat kā sievietēm. Teikts un darīts! Mans saimnieks Fabians ir programmētājs. Viņš arī domāja, ka tā ir lieliska ideja, un nekavējoties sāka.\n\nBet Fabians drīz saprata, ka viņam nav ne jausmas par suņa ciklu. Vai kas tas ir. Tāpēc viņš daudz pētīja internetā, uzdeva daudz jautājumu Korinna un salīdzināja ar esošajām lietotnēm sievietēm.\n\nPēc dažiem mēnešiem un testēšanas fāzes ar maniem draugiem ar ķepām, bija laiks! 27.11.2023. mēs izlaidām Heado Android un iOS ierīcēm App Store.\n\nPatiesībā manas trauksmes fāzes rodas no maniem hormoniem. Bet šķiet, ka ar katru ciklu tas kļūst daudz labāk. Mēs to noteikti turēsim acīs.\n\nCeru, ka šī lietotne var palīdzēt arī jums un jūsu cilvēkiem ātrāk atrast problēmas vai neregularitātes. Un arī iegūt nepieciešamos pierādījumus pie veterinārārsta.\n\nJa jums vai jūsu cilvēkiem ir idejas vai vēlmes, lūdzu, sazinieties ar mani pa e-pastu mayo@heado.app. Arī problēmu, kļūdu vai grūtību gadījumā.\n\nIzbaudiet lietotni! <3\n\nMayo, Korinna & Fabians"

