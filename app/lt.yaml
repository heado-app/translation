          title: "Estro"
          message: "Estro pradžioje jūsų šuo parodys norą poruotis (stovinčioji estro). Makšties išskyros vis dar galimos, tačiau jos labiau panašios į mėsos vandenį ir gali būti gleivingos.\n\nVidutinė trukmė yra 9 dienos ir gali svyruoti nuo 3 iki 21 dienos.\n\nJei ši fazė dar neprasidėjo arba nenorite dokumentuoti šios fazės, palikite šį lauką tuščią."
