    design:
      light: "Šviesi"
      dark: "Tamsi"
      title: "Dizainas"
    title: "Programėlė"
  mayo: "Sveiki, pūkuotas nosis! 🐾\n\nDžiaugiuosi, kad radote mano slaptą vietą! Galbūt jau mane pažįstate. Jei ne, mano vardas Mayo ir aš esu Appenzeller Sennenhund. Žinoma, aš esu patelė! Dabar man 2 metai. Aukščiau pateiktas paveikslėlis esu aš. Tik tam, kad atpažintumėte mane, jei kada nors mane pamatysite.\n\nDeja, mano šeimai ir man reikėjo suprasti, kad visada turiu nerimo fazių. Tam tikru momentu visi manėme, kad mano hormonai eina iš proto prieš mano ciklą ir todėl nebesu tokia drąsi. Bet mes nebuvome visiškai tikri.\n\nMano šeimininkė Korinna tada sugalvojo, kad galima būtų sukurti kalendorių kalytėms, kaip tai yra moterims. Pasakyta-padaryta! Mano šeimininkas Fabianas yra programuotojas. Jis taip pat manė, kad tai puiki idėja ir pradėjo iš karto.\n\nTačiau Fabianas greitai suprato, kad neturi supratimo apie šuns ciklą. Arba kas tai apima. Taigi jis daug tyrinėjo internete, uždavė daug klausimų Korinnai ir lygino su esamomis moterų programėlėmis.\n\nPo kelių mėnesių ir testavimo fazės su mano draugais su letenomis atėjo laikas! 2023-11-27 išleidome Heado „App Store“ parduotuvėje „Android“ ir „iOS“.\n\nIš tikrųjų mano nerimo fazės kyla iš mano hormonų. Bet atrodo, kad su kiekvienu ciklu tai tampa daug geriau. Mes tikrai tai stebėsime.\n\nTikiuosi, kad ši programėlė gali padėti ir jums bei jūsų žmonėms greičiau rasti problemas ar nereguliarumus. Ir taip pat turėti reikiamus įrodymus pas veterinarą.\n\nJei jūs ar jūsų žmonės turite idėjų ar pageidavimų, susisiekite su manimi adresu mayo@heado.app. Taip pat jei turite problemų, klaidų ar sunkumų.\n\nMėgaukitės programėle! <3\n\nMayo, Korinna & Fabian"

