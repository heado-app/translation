    design:
      light: "Luminos"
      dark: "Întunecat"
      title: "Design"
    title: "Aplicație"
  mayo: "Bună, nas pufos! 🐾\n\nMă bucur că ai găsit drumul către locul meu secret! Poate mă cunoști deja. Dacă nu, mă numesc Mayo și sunt un câine Appenzeller Sennenhund. Desigur, sunt o femelă! Am acum 2 ani. Ilustrația de mai sus sunt eu. Doar pentru a mă recunoaște dacă mă vezi vreodată.\n\nDin păcate, familia mea și cu mine a trebuit să înțelegem că întotdeauna am faze de anxietate. La un moment dat, toți am crezut că hormonii mei înnebunesc înainte de ciclul meu și de aceea nu mai sunt atât de curajoasă. Dar nu eram complet siguri.\n\nStăpâna mea Korinna a venit atunci cu ideea că ar putea fi creat un calendar pentru femele, la fel ca pentru femei. Zis și făcut! Stăpânul meu Fabian este un programator. El a crezut, de asemenea, că este o idee fantastică și a început imediat.\n\nDar Fabian și-a dat seama repede că nu avea nicio idee despre ciclul unui câine. Sau despre ce implică acesta. Așa că a făcut multe cercetări pe internet, a pus multe întrebări Korinnei și a comparat cu aplicațiile existente pentru femei.\n\nDupă câteva luni și o fază de testare cu prietenii mei cu patru labe, a venit timpul! Pe 27.11.2023, am lansat Heado în App Store pentru Android și iOS.\n\nDe fapt, fazele mele de anxietate provin din hormonii mei. Dar pare să devină mult mai bine cu fiecare ciclu. Cu siguranță vom monitoriza asta.\n\nSper că această aplicație poate ajuta și pe tine și pe oamenii tăi să găsiți probleme sau nereguli mai repede. Și să aveți, de asemenea, dovezile necesare la veterinar.\n\nDacă tu sau oamenii tăi aveți idei sau dorințe, nu ezitați să mă contactați la mayo@heado.app. De asemenea, în caz de probleme, erori sau dificultăți.\n\nBucurați-vă de aplicație! <3\n\nMayo, Korinna & Fabian"

