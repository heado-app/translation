          title: "Proestrus"
          message: "Estrusul începe când vulva câinelui tău se umflă și apare o secreție vaginală sângeroasă.\n\nDurata medie este de 9 zile și poate varia între 3 și 17 zile.\n\nData trebuie întotdeauna specificată."
        error:
          in_future: "Data nu poate fi în viitor"
      estrus_start_date:
        label: "Începutul estrusului"
        info:
          title: "Estrus"
          message: "La începutul estrusului, câinele tău va arăta dorința de a se împerechea (estrusul în picioare). Secreția vaginală este încă posibilă, dar seamănă mai mult cu apa de carne și poate fi mucoasă.\n\nDurata medie este de 9 zile și poate varia între 3 și 21 de zile.\n\nDacă această fază nu a început încă sau nu dorești să documentezi această fază, lasă acest câmp gol."
        error:
          in_future: "Data nu poate fi în viitor"
      metestrus_start_date:
        label: "Începutul metestrusului"
        info:
          title: "Metestrus"
          message: "Perioada după estrus este caracterizată prin sfârșitul împerecherii. În plus, secreția vaginală se oprește și vulva se retrage. O sarcină falsă este posibilă în acest timp.\n\nDacă această fază nu a început încă sau nu dorești să documentezi această fază, lasă acest câmp gol."
