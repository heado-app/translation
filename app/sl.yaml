      title: "Prevodi"
  app:
    design:
      light: "Svetlo"
      dark: "Temno"
      title: "Dizajn"
    title: "Aplikacija"
  mayo: "Pozdravljeni, puhast nos! 🐾\n\nVesel sem, da ste našli mojo skrivno območje! Morda me že poznate. Če ne, moje ime je Mayo in sem Appenzeller Sennenhund. Seveda sem psica! Zdaj imam 2 leti. Ilustracija zgoraj sem jaz. Samo, da me prepoznate, če me kdaj vidite.\n\nNa žalost je morala moja družina in jaz spoznati, da imam vedno faze tesnobe. Na neki točki smo vsi mislili, da moji hormoni ponorijo pred mojim ciklom, in zato nisem več tako pogumna. A nismo bili povsem prepričani.\n\nMoja lastnica Korinna je nato prišla na idejo, da bi lahko ustvarili koledar za psice, tako kot za ženske. Rekla in storila! Moj lastnik Fabian je programer. Tudi on je mislil, da je to odlična ideja, in je takoj začel.\n\nA Fabian je kmalu spoznal, da nima pojma o pasjem ciklu. Ali kaj to pomeni. Zato je veliko raziskoval na internetu, postavljal številna vprašanja Korinni in primerjal z obstoječimi aplikacijami za ženske.\n\nPo nekaj mesecih in testni fazi z mojimi prijatelji na štirih tacah, je bil čas! 27.11.2023 smo izdali Heado v App Store za Android in iOS.\n\nV resnici moje faze tesnobe izvirajo iz mojih hormonov. A zdi se, da je s vsakim ciklom veliko bolje. Zagotovo bomo to spremljali.\n\nUpam, da lahko ta aplikacija pomaga tudi vam in vašim ljudem hitreje najti težave ali nepravilnosti. In da boste imeli tudi potrebne dokaze pri veterinarju.\n\nČe vi ali vaši ljudje imate ideje ali želje, me prosim kontaktirajte na mayo@heado.app. Tudi v primeru težav, napak ali težav.\n\nUživajte v aplikaciji! <3\n\nMayo, Korinna & Fabian"

