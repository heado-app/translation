      metestrus_start_date:
        label: "Začetek metestrusa"
        info:
          title: "Metestrus"
          message: "Obdobje po estrusu se zaznamuje s koncem parjenja. Poleg tega se izcedek iz nožnice ustavi in vulva se umakne. Lažna brejost je možna v tem času.\n\nČe ta faza še ni začela ali ne želite dokumentirati te faze, pustite to polje prazno."
