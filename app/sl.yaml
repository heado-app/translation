      estrus_start_date:
        label: "Začetek estrusa"
        info:
          title: "Estrus"
          message: "Na začetku estrusa bo vaš pes pokazal pripravljenost za parjenje (stoječi estrus). Izcedek iz nožnice je še vedno možen, vendar bolj spominja na mesnato vodo in je lahko sluzast.\n\nPovprečno trajanje je 9 dni in lahko variira med 3 in 21 dnevi.\n\nČe ta faza še ni začela ali ne želite dokumentirati te faze, pustite to polje prazno."
