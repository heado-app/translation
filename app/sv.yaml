      proestrus_start_date:
        label: "Startdatum för proöstrus"
        info:
          title: "Proöstrus"
          message: "Östrus börjar när din hunds vulva sväller och blodiga vaginala flytningar uppträder.\n\nDen genomsnittliga varaktigheten är 9 dagar och kan variera från 3 till 17 dagar.\n\nDatumet måste alltid anges."
        error:
          in_future: "Datumet får inte ligga i framtiden"
      estrus_start_date:
        label: "Startdatum för östrus"
        info:
          title: "Östrus"
          message: "I början av östrus kommer din hund att visa sig vara redo att para sig (stående östrus). Vaginala flytningar är fortfarande möjliga, men ser mer ut som köttsaft och kan vara slemmiga.\n\nDen genomsnittliga varaktigheten är 9 dagar och kan variera från 3 till 21 dagar.\n\nOm denna fas ännu inte har börjat eller om du inte vill dokumentera denna fas, lämna detta fält tomt."
        error:
          in_future: "Datumet får inte ligga i framtiden"
      metestrus_start_date:
        label: "Startdatum för metöstrus"
        info:
          title: "Metöstrus"
          message: "Perioden efter östrus kännetecknas av slutet på parningen. Dessutom upphör de vaginala flytningarna och vulvan drar sig tillbaka. En skendräktighet är möjlig under denna tid.\n\nOm denna fas ännu inte har börjat eller om du inte vill dokumentera denna fas, lämna detta fält tomt."
        error:
          in_future: "Datumet får inte ligga i framtiden"
      end_date:
        label: "Slutdatum för period (början på vilofas)"
        info:
          title: "Vilofas (anöstrus)"
          message: "Under vilofasen finns det inga tecken på den sexuella cykeln. Vulvan är nu helt indragen.\n\nLämna detta fält tomt om perioden ännu inte har slutat."
        error:
          in_future: "Datumet får inte ligga i framtiden"
