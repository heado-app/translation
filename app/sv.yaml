    translation:
      title: "Översättningar"
  app:
    design:
      light: "Ljus"
      dark: "Mörk"
      title: "Design"
    title: "App"
  mayo: "Hej, lurviga nos! 🐾\n\nJag är glad att du hittade min hemliga plats! Kanske känner du redan till mig. Om inte, mitt namn är Mayo och jag är en Appenzeller Sennenhund. Naturligtvis är jag en tik! Jag är nu 2 år gammal. Illustrationen ovan är jag. Bara så att du känner igen mig om du någonsin ser mig.\n\nTyvärr måste min familj och jag förstå att jag alltid har ångestfaser. Vid något tillfälle trodde vi alla att mina hormoner blev galna innan min cykel började och det var därför jag inte längre var så modig. Men vi var inte helt säkra.\n\nMin ägare Korinna kom då på idén att en kalender för tikar kunde skapas, precis som för kvinnor. Sagt och gjort! Min ägare Fabian är programmerare. Han tyckte också att det var en fantastisk idé och började genast.\n\nMen Fabian insåg snabbt att han inte hade någon aning om en hunds cykel. Eller vad det innebar. Så han gjorde mycket forskning på internet, ställde många frågor till Korinna och jämförde med befintliga appar för kvinnor.\n\nEfter några månader och en testfas med mina fyrbenta vänner var det dags! Den 27-11-2023 släppte vi Heado i App Store för Android och iOS.\n\nFaktum är att mina ångestfaser orsakas av mina hormoner. Men det verkar bli mycket bättre med varje cykel. Vi kommer definitivt att hålla ett öga på det.\n\nJag hoppas att denna app kan hjälpa dig och dina människor att hitta problem eller oregelbundenheter snabbare. Och också ha nödvändiga bevis hos veterinären.\n\nOm du eller dina människor har idéer eller önskemål, tveka inte att kontakta mig på mayo@heado.app. Även vid problem, fel eller svårigheter.\n\nNjut av appen! <3\n\nMayo, Korinna & Fabian"

