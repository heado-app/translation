  day_form:
    period:
      title: "Okres"
      enable: "Dodaj cykl okresu"
      disable: "Usuń cykl okresu"
      proestrus_start_date:
        label: "Początek proestrus"
        info:
          title: "Proestrus"
          message: "Estrus rozpoczyna się, gdy srom twojego psa puchnie i pojawiają się krwiste wydzieliny z pochwy.\n\nŚredni czas trwania to 9 dni i może się wahać od 3 do 17 dni.\n\nData zawsze musi być podana."
        error:
          in_future: "Data nie może być w przyszłości"
      estrus_start_date:
        label: "Początek estrus"
        info:
          title: "Estrus"
          message: "Na początku estrus twój pies będzie wykazywał chęć do parzenia się (stojący estrus). Wydzieliny z pochwy są nadal możliwe, ale bardziej przypominają mięsne wody i mogą być śluzowate.\n\nŚredni czas trwania to 9 dni i może się wahać od 3 do 21 dni.\n\nJeśli ta faza jeszcze się nie rozpoczęła lub nie chcesz jej dokumentować, pozostaw to pole puste."
        error:
          in_future: "Data nie może być w przyszłości"
      metestrus_start_date:
        label: "Początek metestrus"
        info:
          title: "Metestrus"
          message: "Okres po estrus charakteryzuje się końcem parzenia. Dodatkowo wydzieliny z pochwy ustają, a srom się cofa. Fałszywa ciąża jest możliwa w tym czasie.\n\nJeśli ta faza jeszcze się nie rozpoczęła lub nie chcesz jej dokumentować, pozostaw to pole puste."
        error:
          in_future: "Data nie może być w przyszłości"
      end_date:
        label: "Koniec okresu (początek fazy spoczynku)"
        info:
          title: "Faza spoczynku (anestrus)"
          message: "Podczas fazy spoczynku nie ma oznak cyklu płciowego. Srom jest teraz całkowicie cofnięty.\n\nPozostaw to pole puste, jeśli okres jeszcze się nie zakończył."
