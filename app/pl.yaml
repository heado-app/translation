  app:
    design:
      light: "Jasny"
      dark: "Ciemny"
      title: "Wygląd"
    title: "Aplikacja"
  mayo: "Cześć, futrzasty nosie! 🐾\n\nCieszę się, że znalazłeś drogę do mojego sekretnego miejsca! Może mnie już znasz. Jeśli nie, nazywam się Mayo i jestem psem rasy Appenzeller Sennenhund. Oczywiście jestem suką! Mam teraz 2 lata. Ilustracja powyżej to ja. Tylko po to, żebyś mnie rozpoznał, jeśli kiedykolwiek mnie spotkasz.\n\nNiestety moja rodzina i ja musieliśmy zrozumieć, że zawsze mam fazy lęku. W pewnym momencie wszyscy myśleliśmy, że moje hormony szaleją przed moim cyklem i dlatego już nie jestem taka odważna. Ale nie byliśmy całkowicie pewni.\n\nMoja pani Korinna wpadła wtedy na pomysł, że można by stworzyć kalendarz dla suk, tak jak dla kobiet. Powiedziała i zrobiła! Mój pan Fabian jest programistą. On też myślał, że to świetny pomysł i od razu zaczął pracować.\n\nAle Fabian szybko zdał sobie sprawę, że nie ma pojęcia o cyklu psa. Albo co to oznacza. Więc dużo badał w internecie, zadawał wiele pytań Korinnie i porównywał z istniejącymi aplikacjami dla kobiet.\n\nPo kilku miesiącach i fazie testowej z moimi przyjaciółmi na czterech łapach nadszedł czas! 27 listopada 2023 roku wypuściliśmy Heado w Sklepie Play i App Store dla Androida i iOS.\n\nW rzeczywistości moje fazy lęku są spowodowane moimi hormonami. Ale wydaje się, że z każdym cyklem staje się to znacznie lepsze. Na pewno będziemy to monitorować.\n\nMam nadzieję, że ta aplikacja może pomóc również Tobie i Twoim właścicielom w szybszym znalezieniu problemów lub nieprawidłowości. I aby mieć również niezbędne dowody u weterynarza.\n\nJeśli Ty lub Twoi właściciele macie pomysły lub życzenia, skontaktujcie się ze mną pod adresem mayo@heado.app. Również w przypadku problemów, błędów lub trudności.\n\nMiłej zabawy z aplikacją! <3\n\nMayo, Korinna & Fabian"

