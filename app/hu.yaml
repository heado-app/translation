      title: "Fordítások"
  app:
    design:
      light: "Világos"
      dark: "Sötét"
      title: "Dizájn"
    title: "Alkalmazás"
  mayo: "Szia, szőrös orr! 🐾\n\nÖrülök, hogy rátaláltál a titkos részemre! Lehet, hogy már ismersz. Ha nem, a nevem Mayo, és egy Appenzeller Sennenhund vagyok. Természetesen szuka vagyok! Most 2 éves vagyok. A fenti illusztráció én vagyok. Csak azért, hogy felismerj, ha valaha találkozunk.\n\nSajnos a családomnak és nekem rá kellett jönnünk, hogy mindig vannak szorongásos fázisaim. Egy időben mindannyian azt hittük, hogy a hormonjaim megbolondulnak a tüzelés előtt, és ezért nem vagyok már annyira bátor. De nem voltunk teljesen biztosak.\n\nGazdám, Korinna akkoriban kitalálta, hogy lehetne egy naptárat készíteni szuka kutyáknak, mint ahogy nőknek is van. Mondta és megtette! Gazdám, Fabian programozó. Ő is fantasztikus ötletnek találta, és azonnal elkezdett dolgozni rajta.\n\nDe Fabian hamar rájött, hogy fogalma sincs a kutya ciklusáról. Vagy arról, mit is jelent ez. Így sok kutatást végzett az interneten, sok kérdést tett fel Korinnának, és összehasonlította a már meglévő női alkalmazásokkal.\n\nNéhány hónap és egy tesztelési fázis után a mancsos barátaimmal elérkezett az idő! 2023.11.27-én kiadtuk a Heado-t az Android és iOS alkalmazásboltokban.\n\nValójában a szorongásos fázisaim a hormonjaimból fakadnak. De úgy tűnik, hogy minden tüzeléssel egyre jobb lesz. Mindenképpen figyelemmel kísérjük.\n\nRemélem, hogy ez az alkalmazás segíthet neked és a gazdáidnak, hogy gyorsabban találjatok problémákat vagy rendellenességeket. És hogy az állatorvosnál is meglegyenek a szükséges bizonyítékok.\n\nHa neked vagy a gazdáidnak vannak ötleteitek vagy kívánságaitok, kérlek, lépjetek velem kapcsolatba a mayo@heado.app címen. Problémák, hibák vagy nehézségek esetén is.\n\nJó szórakozást az alkalmazáshoz! <3\n\nMayo, Korinna & Fabian"

