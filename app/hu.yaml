          in_future: "A dátum nem lehet a jövőben"
      estrus_start_date:
        label: "Ösztrusz kezdete"
        info:
          title: "Ösztrusz"
          message: "Az ösztrusz kezdetén a szuka párosodási hajlandóságot mutat (álló ösztrusz). A hüvelyi folyás még mindig lehetséges, de inkább húsos vízre hasonlít és lehet nyálkás.\n\nAz átlagos időtartam 9 nap, de 3 és 21 nap között változhat.\n\nHa ez a fázis még nem kezdődött el, vagy nem kívánod dokumentálni ezt a fázist, hagyd ezt a mezőt üresen."
