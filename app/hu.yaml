          title: "Proösztrusz"
          message: "Az ösztrusz akkor kezdődik, amikor a szuka vulvája megduzzad és véres hüvelyi folyás jelentkezik.\n\nAz átlagos időtartam 9 nap, de 3 és 17 nap között változhat.\n\nA dátumot mindig meg kell adni."
