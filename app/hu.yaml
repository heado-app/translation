          in_future: "A dátum nem lehet a jövőben"
      metestrus_start_date:
        label: "Metösztrusz kezdete"
        info:
          title: "Metösztrusz"
          message: "Az ösztrusz utáni időszakot a párosodás vége jellemzi. Emellett a hüvelyi folyás megszűnik és a vulva visszahúzódik. Az álterhesség ebben az időszakban lehetséges.\n\nHa ez a fázis még nem kezdődött el, vagy nem kívánod dokumentálni ezt a fázist, hagyd ezt a mezőt üresen."
