      title: "Traductions"
  app:
    design:
      light: "Clair"
      dark: "Sombre"
      title: "Design"
    title: "App"
  mayo: "Hey truffe! 🐾\n\nRavi que vous ayez trouvé le chemin de ma zone secrète! Peut-être que vous me connaissez déjà. Sinon, mon nom est Mayo et je suis une chienne de montagne de l'Appenzell. Une femelle, bien sûr! J'ai maintenant 2 ans. L'illustration ci-dessus, c'est moi. Juste pour que vous puissiez me reconnaître si vous me voyez un jour.\n\nMalheureusement, ma famille et moi avons dû réaliser que j'ai toujours des phases d'anxiété. À un moment donné, nous avons tous pensé que mes hormones devenaient folles avant mes chaleurs et que c'est pourquoi je n'étais plus aussi courageuse. Mais nous n'en étions pas vraiment sûrs.\n\nMon propriétaire Korinna a alors eu l'idée que vous pourriez faire un calendrier pour les chiennes, tout comme pour les femmes humaines. Aussitôt dit, aussitôt fait! Mon maître Fabian est programmeur. Il a aussi trouvé que c'était une super idée et a commencé tout de suite.\n\nMais Fabian s'est vite rendu compte qu'il n'avait aucune idée du cycle d'une chienne. Ou de ce que cela implique. Alors il a fait beaucoup de recherches sur Internet, a posé beaucoup de questions à Korinna et a comparé avec les applications existantes pour les femmes humaines.\n\nAprès quelques mois et une phase de test avec mes amis à pattes, le moment était venu! Le 27.11.2023, nous avons publié Heado sur l'App Store pour Android et iOS.\n\nEn fait, mes phases d'anxiété viennent de mes hormones. Mais il semble que cela s'améliore beaucoup avec chaque chaleur. Nous allons certainement garder un œil dessus.\n\nJ'espère que cette application pourra aussi vous aider, vous et vos humains, à trouver des problèmes ou des irrégularités plus rapidement. Et aussi avoir les preuves nécessaires chez le vétérinaire.\n\nSi vous ou vos humains avez des idées ou des demandes, veuillez me contacter à mayo@heado.app. Aussi en cas de problèmes, d'erreurs ou de difficultés.\n\nAmusez-vous bien avec l'application! <3\n\nMayo, Korinna & Fabian"

