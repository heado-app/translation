  day_form:
    period:
      title: "Période"
      enable: "Ajouter un cycle de période"
      disable: "Supprimer le cycle de période"
      proestrus_start_date:
        label: "Début de la pré-chaleur (proestrus)"
        info:
          title: "Pré-chaleur (proestrus)"
          message: "L'oestrus commence lorsque la vulve de votre chienne gonfle et qu'un écoulement vaginal sanglant apparaît.\n\nLa durée moyenne est de 9 jours et peut varier entre 3 et 17 jours.\n\nLa date doit toujours être spécifiée."
        error:
          in_future: "La date ne doit pas être dans le futur"
      estrus_start_date:
        label: "Début de la chaleur (estrus)"
        info:
          title: "Chaleur (estrus)"
          message: "Avec le début de la chaleur, votre chienne montrera une volonté de s'accoupler (chaleur de monte). L'écoulement vaginal est toujours possible, mais il ressemble davantage à de l'eau de viande et peut être muqueux.\n\nLa durée moyenne est de 9 jours et peut varier entre 3 et 21 jours.\n\nSi cette phase n'a pas encore commencé ou si vous ne souhaitez pas documenter cette phase, laissez ce champ vide."
        error:
          in_future: "La date ne doit pas être dans le futur"
      metestrus_start_date:
        label: "Début de la post-chaleur (metestrus)"
        info:
          title: "Post-chaleur (metestrus)"
          message: "La période après la chaleur est caractérisée par la fin de l'accouplement. De plus, l'écoulement vaginal cesse et la vulve se rétracte. Une grossesse nerveuse est possible pendant cette période.\n\nSi cette phase n'a pas encore commencé ou si vous ne souhaitez pas documenter cette phase, laissez ce champ vide."
        error:
          in_future: "La date ne doit pas être dans le futur"
      end_date:
        label: "Fin de la période (début de la phase de repos)"
        info:
          title: "Phase de repos (anestrus)"
          message: "Il n'y a aucun signe du cycle sexuel pendant la phase de repos. La vulve est maintenant complètement rétractée.\n\nLaissez ce champ vide si la période n'est pas encore terminée."
        error:
          in_future: "La date ne doit pas être dans le futur"
    false_pregnancy:
      title: "Grossesse nerveuse"
      enable: "Ajouter une grossesse nerveuse"
      disable: "Supprimer la grossesse nerveuse"
      start_date:
        label: "Début de la grossesse nerveuse"
        error:
          in_future: "La date ne doit pas être dans le futur"
      end_date:
