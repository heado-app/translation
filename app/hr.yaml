      proestrus_start_date:
        label: "Početak proestrusa"
        info:
          title: "Proestrus"
          message: "Estrus počinje kada se vulva vaše kuje nabrekne i pojavi se krvavi vaginalni iscjedak.\n\nProsječno trajanje je 9 dana i može varirati između 3 i 17 dana.\n\nDatum uvijek treba biti naveden."
        error:
          in_future: "Datum ne smije biti u budućnosti"
      estrus_start_date:
        label: "Početak estrusa"
        info:
          title: "Estrus"
          message: "Na početku estrusa, vaša kuja pokazuje spremnost za parenje (stojeći estrus). Vaginalni iscjedak je još uvijek moguć, ali više nalikuje mesnoj vodi i može biti sluzav.\n\nProsječno trajanje je 9 dana i može varirati između 3 i 21 dana.\n\nAko ova faza još nije počela ili ne želite dokumentirati ovu fazu, ostavite ovo polje prazno."
        error:
          in_future: "Datum ne smije biti u budućnosti"
      metestrus_start_date:
        label: "Početak metestrusa"
        info:
          title: "Metestrus"
          message: "Period nakon estrusa karakterizira kraj parenja. Osim toga, vaginalni iscjedak prestaje i vulva se povlači. Lažna trudnoća je moguća tijekom ovog vremena.\n\nAko ova faza još nije počela ili ne želite dokumentirati ovu fazu, ostavite ovo polje prazno."
        error:
          in_future: "Datum ne smije biti u budućnosti"
      end_date:
        label: "Kraj perioda (početak faze mirovanja)"
        info:
          title: "Faza mirovanja (anestrus)"
          message: "Nema znakova seksualnog ciklusa tijekom faze mirovanja. Vulva je sada potpuno povučena.\n\nOstavite ovo polje prazno ako period još nije završio."
