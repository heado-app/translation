  app:
    design:
      light: "Svijetli"
      dark: "Tamni"
      title: "Dizajn"
    title: "Aplikacija"
  mayo: "Bok, šapice! 🐾\n\nDrago mi je da si pronašao put do mog tajnog prostora! Možda me već poznaješ. Ako ne, moje ime je Mayo i ja sam Appenzeller Sennenhund. Naravno, ženka sam! Sada imam 2 godine. Ilustracija iznad je ja. Samo da me prepoznaš ako me ikad vidiš.\n\nNažalost, moja obitelj i ja smo morali shvatiti da stalno imam faze tjeskobe. U jednom trenutku smo svi mislili da moji hormoni polude prije mog ciklusa i zato više nisam tako hrabra. Ali nismo bili potpuno sigurni.\n\nTada je moja vlasnica Korinna dobila ideju da bi se mogao napraviti kalendar za ženke pasa, kao što je to za žene. Rečeno učinjeno! Moj gospodar Fabian je programer. Također je mislio da je to fantastična ideja i odmah je počeo raditi.\n\nAli Fabian je ubrzo shvatio da nema pojma o ciklusu psa. Ili što to uključuje. Tako je puno istraživao na internetu, postavljao puno pitanja Korinni i uspoređivao to s postojećim aplikacijama za žene.\n\nNakon nekoliko mjeseci i faze testiranja s mojim prijateljima s šapama, bilo je vrijeme! 27.11.2023. izdali smo Heado u App Storeu za Android i iOS.\n\nZapravo, moje faze tjeskobe dolaze od mojih hormona. Ali čini se da postaje puno bolje sa svakim ciklusom. Sigurno ćemo to pratiti.\n\nNadam se da ova aplikacija može pomoći tebi i tvojim ljudima da brže pronađete probleme ili nepravilnosti. I također imati potrebne dokaze kod veterinara.\n\nAko ti ili tvoji ljudi imate ideje ili želje, slobodno me kontaktirajte na mayo@heado.app. Također u slučaju problema, grešaka ili poteškoća.\n\nUživaj u aplikaciji! <3\n\nMayo, Korinna & Fabian"

